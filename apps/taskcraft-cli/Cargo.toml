[package]
name = "taskcraft-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
client = { version = "2.0.0", path = "../../crates/client" }
engine = { version = "2.0.0", path = "../../crates/engine" }
i18n = { version = "2.0.0", path = "../../crates/i18n" }
mcp = { version = "2.0.0", path = "../../crates/mcp" }
model = { version = "2.0.0", path = "../../crates/model" }
protocol = { version = "2.0.0", path = "../../crates/protocol" }
serde_json = "1.0.154"
server = { version = "2.0.0", path = "../../crates/server" }
store-sqlite = { version = "2.0.0", path = "../../crates/store-sqlite" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
