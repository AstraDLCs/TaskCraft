[package]
name = "mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23.1"
client = { version = "2.0.0", path = "../client" }
engine = { version = "2.0.0", path = "../engine" }
foundation = { version = "2.0.0", path = "../foundation" }
i18n = { version = "2.0.0", path = "../i18n" }
jiff = "0.2.38"
model = { version = "2.0.0", path = "../model" }
protocol = { version = "2.0.0", path = "../protocol" }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde_json = "1.0.154"
store = { version = "2.0.0", path = "../store" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
rcgen = "0.14.10"
store-sqlite = { path = "../store-sqlite" }

[package.metadata.craft]
layer = 6
