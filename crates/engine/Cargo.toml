[package]
name = "engine"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
diagram = { version = "2.0.0", path = "../diagram" }
exchange = { version = "2.0.0", path = "../exchange" }
foundation = { version = "2.0.0", path = "../foundation" }
i18n = { version = "2.0.0", path = "../i18n" }
jiff = "0.2.38"
model = { version = "2.0.0", path = "../model" }
protocol = { version = "2.0.0", path = "../protocol" }
rules = { version = "2.0.0", path = "../rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
store = { version = "2.0.0", path = "../store" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[package.metadata.craft]
layer = 5

[features]
# Expone engine::testing (banco multiagente) a otros crates.
testing = []

[dev-dependencies]
store-postgres = { path = "../store-postgres" }
store-sqlite = { path = "../store-sqlite" }
